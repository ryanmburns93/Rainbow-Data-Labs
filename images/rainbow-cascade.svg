<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
	<defs>
		<linearGradient id="rainbow-main" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#8f00ff"/>
			<stop offset="14%" stop-color="#005cff"/>
			<stop offset="28%" stop-color="#00e676"/>
			<stop offset="42%" stop-color="#ffe600"/>
			<stop offset="57%" stop-color="#ff7a00"/>
			<stop offset="71%" stop-color="#ff0054"/>
			<stop offset="85%" stop-color="#b517ff"/>
			<stop offset="100%" stop-color="#00c8ff"/>
		</linearGradient>
		<linearGradient id="rainbow-shift" x1="100%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#ff0054" stop-opacity="0.55"/>
			<stop offset="25%" stop-color="#ffe600" stop-opacity="0.45"/>
			<stop offset="50%" stop-color="#00e676" stop-opacity="0.5"/>
			<stop offset="75%" stop-color="#005cff" stop-opacity="0.55"/>
			<stop offset="100%" stop-color="#8f00ff" stop-opacity="0.5"/>
		</linearGradient>
		<linearGradient id="depth" x1="0%" y1="0%" x2="0%" y2="100%">
			<stop offset="0%" stop-color="#1a0a2e" stop-opacity="0"/>
			<stop offset="100%" stop-color="#1a0a2e" stop-opacity="0.12"/>
		</linearGradient>
	</defs>
	<rect width="1920" height="1080" fill="url(#rainbow-main)"/>
	<rect width="1920" height="1080" fill="url(#rainbow-shift)"/>
	<rect width="1920" height="1080" fill="url(#depth)"/>
</svg>
