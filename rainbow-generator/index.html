<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Rainbow Generator</title>
<style>
  :root {
    --bg: #05050a;
    --text-dim: #9a9aab;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
    cursor: crosshair;
  }

  #hint {
    position: fixed;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--text-dim);
    background: rgba(15, 15, 25, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    padding: 8px 16px;
    border-radius: 999px;
    pointer-events: none;
    transition: opacity 0.6s ease;
    white-space: nowrap;
  }
  #hint.faded { opacity: 0; }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="hint">click or tap for a rainbow burst</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  const BURST_COUNT = 260; // max density, fixed
  const MAX_PARTICLES = 6000;

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  const particles = [];
  let hue = 0;

  function burst(x, y) {
    for (let i = 0; i < BURST_COUNT; i++) {
      if (particles.length >= MAX_PARTICLES) particles.shift();
      const angle = (i / BURST_COUNT) * Math.PI * 2 + Math.random() * 0.2;
      const speed = Math.random() * 6 + 2;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.006 + Math.random() * 0.01,
        size: Math.random() * 3.5 + 2,
        hue: (hue + Math.random() * 360) % 360,
      });
    }
  }

  function fadeHint() {
    hint.classList.add('faded');
  }

  canvas.addEventListener('mousedown', (e) => { burst(e.clientX, e.clientY); fadeHint(); });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) burst(t.clientX, t.clientY);
    fadeHint();
  }, { passive: false });

  let last = performance.now();

  function frame(now) {
    const dt = Math.min(now - last, 50);
    last = now;
    hue = (hue + dt * 0.03) % 360;

    // never clear or fade the canvas -- every stroke painted stays forever
    ctx.globalCompositeOperation = 'source-over';

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.985;
      p.vy *= 0.985;
      p.life -= p.decay;
      // once life runs out we just stop simulating it; the trail it already
      // painted is never erased
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.fillStyle = `hsl(${p.hue}, 100%, 60%)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
